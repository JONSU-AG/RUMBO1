<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link

<title>Academias · RUMBO</title>

<style>
  .academy-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .academy-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 190px;
    padding: 25px;
    background: #fff;
    border-radius: 18px;
    text-decoration: none;
    color: #0B1229;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
    transition: transform .2s, box-shadow .2s;
    border-top: 5px solid transparent;
    cursor: pointer;
  }

  .academy-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0,0,0,.13);
  }

  .academy-card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    margin-bottom: 15px;
    border-radius: 16px;
    color: #fff;
    font-family: Poppins, sans-serif;
    font-size: 28px;
    font-weight: 800;
  }

  .academy-card-title {
    font-family: Poppins, sans-serif;
    font-size: 21px;
    font-weight: 800;
  }

  .academy-card-text {
    margin-top: 5px;
    color: #667085;
    font-family: Inter, sans-serif;
    font-size: 14px;
  }

  /* ESPARTA */
  .academy-card.esparta {
    border-top-color: #E8433F;
  }

  .academy-card.esparta .academy-card-icon {
    background: #E8433F;
  }

  .academy-card.esparta .academy-card-title {
    color: #E8433F;
  }

  /* KELSEN */
  .academy-card.kelsen {
    border-top-color: #6B7280;
  }

  .academy-card.kelsen .academy-card-icon {
    background: #6B7280;
  }

  .academy-card.kelsen .academy-card-title {
    color: #6B7280;
  }

  /* BRICEÑO */
  .academy-card.briceno {
    border-top-color: #2563EB;
  }

  .academy-card.briceno .academy-card-icon {
    background: #2563EB;
  }

  .academy-card.briceno .academy-card-title {
    color: #2563EB;
  }

  @media (max-width: 900px) {
    .academy-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 700px) {
    .academy-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
